<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Admin | Bella Massa</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="admin">

<h2>🔐 Admin - Bella Massa</h2>

<label>Nome da Pizzaria</label>
<input id="admName">

<label>Telefone</label>
<input id="admPhone">

<hr>

<h3>🔥 Promoção do Dia</h3>

<label>Título</label>
<input id="promoTitle">

<label>Descrição</label>
<input id="promoDesc">

<label>Preço</label>
<input id="promoPrice">

<label>Imagem (URL)</label>
<input id="promoImage">

<label>Tempo da Promo (min)</label>
<input id="promoTime">

<button onclick="savePromo()">Salvar Promoção</button>

<hr>

<h3>🧠 Combos Inteligentes</h3>

<button onclick="addCombo('Individual')">+ Combo Individual</button>
<button onclick="addCombo('Casal')">+ Combo Casal</button>
<button onclick="addCombo('Família')">+ Combo Família</button>

<hr>

<button onclick="logout()">Sair</button>

<script src="app.js"></script>
</body>
</html>
