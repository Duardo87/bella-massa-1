<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin • Bella Massa</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #b11212;
      color: #fff;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      background: rgba(255,255,255,0.2);
      padding: 8px 12px;
      border-radius: 6px;
    }

    .container {
      padding: 16px;
      max-width: 700px;
      margin: auto;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 12px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 14px;
      margin-top: 12px;
    }

    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-top: 4px;
      font-size: 15px;
    }

    button {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn {
      background: #25d366;
      color: #fff;
    }

    .btn-red {
      background: #b11212;
      color: #fff;
    }

    .btn-outline {
      background: #fff;
      border: 2px solid #b11212;
      color: #b11212;
    }

    .hidden {
      display: none;
    }

    small {
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <strong>🔐 Admin • Bella Massa</strong>
  <a href="index.html">Ver site</a>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="login" class="card">
    <h2>Login</h2>

    <label>Email</label>
    <input id="loginEmail" value="admin@bellamassa.com">

    <label>Senha</label>
    <input id="loginPass" type="password" value="123456">

    <button class="btn" onclick="login()">Entrar</button>

    <small>Login simples (local)</small>
  </div>

  <!-- ADMIN -->
  <div id="admin" class="hidden">

    <!-- DADOS -->
    <div class="card">
      <h2>🏪 Dados da Pizzaria</h2>

      <label>Nome</label>
      <input id="storeName">

      <label>Telefone (WhatsApp)</label>
      <input id="storePhone">

      <button class="btn-red" onclick="saveStore()">Salvar</button>
    </div>

    <!-- PROMOÇÃO -->
    <div class="card">
      <h2>🔥 Promoção do Dia</h2>

      <label>Título</label>
      <input id="promoTitle">

      <label>Descrição</label>
      <input id="promoDesc">

      <label>Preço</label>
      <input id="promoPrice">

      <label>Imagem (URL)</label>
      <input id="promoImage">

      <label>Duração (minutos)</label>
      <input id="promoTime">

      <button class="btn" onclick="savePromo()">Salvar promoção</button>
    </div>

    <!-- COMBOS -->
    <div class="card">
      <h2>📦 Combos Inteligentes</h2>

      <button class="btn-outline" onclick="addCombo('Individual')">+ Combo Individual</button>
      <button class="btn-outline" onclick="addCombo('Casal')">+ Combo Casal</button>
      <button class="btn-outline" onclick="addCombo('Família')">+ Combo Família</button>
    </div>

    <!-- JSON -->
    <div class="card">
      <h2>📤 Backup</h2>

      <button class="btn-outline" onclick="exportJSON()">Exportar JSON</button>
      <input type="file" onchange="importJSON(event)">
    </div>

    <button class="btn-red" onclick="logout()">Sair</button>
  </div>
</div>

<script>
  const DB = () => JSON.parse(localStorage.getItem("pizzaria") || "{}");
  const SAVE = (d) => localStorage.setItem("pizzaria", JSON.stringify(d));

  function login() {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("admin").classList.remove("hidden");
    load();
  }

  function logout() {
    location.reload();
  }

  function load() {
    const d = DB();
    storeName.value = d.name || "";
    storePhone.value = d.phone || "";

    promoTitle.value = d.promo?.title || "";
    promoDesc.value = d.promo?.desc || "";
    promoPrice.value = d.promo?.price || "";
    promoImage.value = d.promo?.image || "";
    promoTime.value = d.promo?.time || "";
  }

  function saveStore() {
    const d = DB();
    d.name = storeName.value;
    d.phone = storePhone.value;
    SAVE(d);
    alert("Dados salvos");
  }

  function savePromo() {
    const d = DB();
    d.promo = {
      title: promoTitle.value,
      desc: promoDesc.value,
      price: promoPrice.value,
      image: promoImage.value,
      time: promoTime.value,
      start: Date.now()
    };
    SAVE(d);
    alert("Promoção salva");
  }

  function addCombo(tipo) {
    const d = DB();
    d.combos = d.combos || [];
    d.combos.push({ tipo, date: Date.now() });
    SAVE(d);
    alert("Combo " + tipo + " criado");
  }

  function exportJSON() {
    const blob = new Blob([JSON.stringify(DB(), null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "backup-pizzaria.json";
    a.click();
  }

  function importJSON(e) {
    const r = new FileReader();
    r.onload = () => SAVE(JSON.parse(r.result));
    r.readAsText(e.target.files[0]);
    alert("JSON importado");
  }
</script>

</body>
</html>
