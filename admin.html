<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — Sua Pizzaria</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background:#f5f5f5;
      font-family: Arial, sans-serif;
      margin:0;
    }
    header {
      background:#fff;
      padding:14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      border-bottom:1px solid #ddd;
      position:sticky;
      top:0;
      z-index:10;
    }
    header h1 {
      font-size:18px;
      margin:0;
    }
    header a {
      text-decoration:none;
      color:#b23a2b;
      font-weight:bold;
    }
    .container {
      padding:14px;
    }
    .box {
      background:#fff;
      border-radius:8px;
      padding:14px;
      margin-bottom:14px;
    }
    .box h2 {
      font-size:16px;
      margin-bottom:10px;
    }
    input, textarea, select {
      width:100%;
      padding:12px;
      font-size:16px;
      margin-bottom:10px;
      border-radius:6px;
      border:1px solid #ccc;
    }
    button {
      width:100%;
      padding:14px;
      font-size:16px;
      border-radius:6px;
      border:none;
      background:#b23a2b;
      color:#fff;
      font-weight:bold;
    }
    .item {
      border-bottom:1px solid #eee;
      padding:10px 0;
    }
    .item:last-child {
      border-bottom:none;
    }
    .item small {
      color:#777;
    }
    .btn-light {
      background:#eee;
      color:#333;
      margin-top:6px;
    }
  </style>
</head>

<body>

<header>
  <h1>Admin — Sua Pizzaria</h1>
  <a href="index.html">Ver site</a>
</header>

<div class="container">

  <!-- DADOS DA PIZZARIA -->
  <div class="box">
    <h2>Dados da Pizzaria</h2>
    <input id="admin-name" placeholder="Nome da pizzaria" />
    <input id="admin-phone" placeholder="WhatsApp (ex: 5511999999999)" />
    <button onclick="saveSettings()">Salvar</button>
  </div>

  <!-- ADICIONAR PRODUTO -->
  <div class="box">
    <h2>Adicionar Produto</h2>
    <input id="prod-name" placeholder="Nome do produto" />
    <textarea id="prod-desc" placeholder="Descrição"></textarea>
    <input id="prod-price" placeholder="Preço (ex: 29.90)" />
    <select id="prod-category"></select>
    <button onclick="addProduct()">Adicionar produto</button>
  </div>

  <!-- LISTA DE PRODUTOS -->
  <div class="box">
    <h2>Produtos</h2>
    <div id="product-list"></div>
  </div>

</div>

<script src="app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (window.app && window.app.renderAdmin) {
      window.app.renderAdmin();
    }
  });
</script>

</body>
</html>
