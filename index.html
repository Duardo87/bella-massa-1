<!doctype html>
<html lang="pt-BR">
<head><div id="promo-overlay" class="promo-overlay hidden">
  <div class="promo-card">
    <img id="promo-img" />
    <h2 id="promo-title"></h2>
    <p id="promo-desc"></p>
    <strong id="promo-price"></strong>
    <div id="promo-timer"></div>

    <button class="btn green" onclick="aceitarPromo()">🔥 Aproveitar</button>
    <button class="btn ghost" onclick="fecharPromo()">Talvez depois</button>
  </div>
</div>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bella Massa | Cardápio</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="top">
  <div>
    <h1 id="storeName">Bella Massa</h1>
    <a id="storePhone" href="#">📞 62 99999-9999</a>
  </div>
</header>

<!-- PROMOÇÃO DO DIA -->
<div id="promoModal" class="promo-modal">
  <div class="promo-box">
    <img id="promoImage" src="" alt="Promoção">
    <h2 id="promoTitle">🔥 Promoção do Dia</h2>
    <p id="promoDesc"></p>
    <strong id="promoPrice"></strong>

    <div id="countdown"></div>

    <button onclick="acceptPromo()">Aproveitar</button>
    <span onclick="closePromo()">Talvez depois</span>
  </div>
</div>

<!-- CATEGORIAS -->
<div id="categories" class="categories"></div>

<!-- PRODUTOS -->
<div id="products" class="products"></div>

<!-- WHATSAPP -->
<button class="whatsapp" onclick="sendWhats()">🟢 Pedir no WhatsApp</button>

<script src="app.js"></script>
</body>
</html><section class="card">
  <h2>📦 Backup / Exportação</h2>

  <button class="btn" onclick="exportarJSON()">📤 Exportar JSON</button>

  <br><br>

  <input type="file" id="import-json" accept="application/json" />
  <button class="btn ghost" onclick="importarJSON()">📥 Importar JSON</button>
</section>
