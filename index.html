<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bella Massa — Cardápio</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- PROMOÇÃO DO DIA -->
<div id="promo-dia" class="overlay">
  <div class="box">
    <img id="promo-foto">
    <h2 id="promo-titulo"></h2>
    <p id="promo-texto"></p>
    <p id="contador"></p>
    <button onclick="aproveitarPromo()">Aproveitar oferta</button>
    <button class="link" onclick="fecharPromo()">Talvez depois</button>
  </div>
</div>

<!-- RESUMO -->
<div id="resumo" class="overlay" style="display:none">
  <div class="box">
    <h2>🧾 Resumo do Pedido</h2>
    <div id="resumo-itens"></div>
    <p id="resumo-total"></p>
    <button onclick="confirmarPedido()">Confirmar no WhatsApp</button>
    <button class="link" onclick="fecharResumo()">Voltar</button>
  </div>
</div>

<header>
  <div class="brand">
    <img src="logo.png" class="logo" onerror="this.style.display='none'">
    <div>
      <h1>Bella Massa</h1>
      <a href="tel:+5562993343622">📞 62 99334-3622</a>
    </div>
  </div>
</header>

<main>
  <h2>🔥 Combos Mais Pedidos</h2>
  <div id="combos"></div>

  <h2>🍕 Cardápio</h2>
  <div id="produtos"></div>
</main>

<button class="whatsapp" onclick="abrirResumo()">🟢 Ver pedido</button>

<script src="app.js"></script>
</body>
</html>
